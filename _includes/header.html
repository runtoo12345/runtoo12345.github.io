{%- assign current = page.url | default: "/" -%}
<header class="masthead">
  <div class="shell masthead__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="seal" aria-hidden="true">录</span>
      <span class="brand__text">
        <span class="brand__name" translate="no">runtoo</span>
        <span class="brand__kind">手记</span>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <ul role="list">
        <li>
          <a href="{{ '/' | relative_url }}"{% if current == "/" or current == "/index.html" %} aria-current="page"{% endif %}>首页</a>
        </li>
        <li>
          <a href="{{ '/articles/' | relative_url }}"{% if current == "/articles/" or current == "/articles/index.html" or page.layout == "post" %} aria-current="page"{% endif %}>文章</a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}"{% if current == "/about/" or current == "/about/index.html" %} aria-current="page"{% endif %}>关于</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
